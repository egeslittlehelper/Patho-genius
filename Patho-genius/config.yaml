# ─────────────────────────────────────────────────────────────────────────────
# Pathogenius Edge-Computing Pipeline Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Classification runs on a Jetson Nano (CU-CLARK-L, GPU-accelerated)
# over Tailscale SSH.  JSON conversion runs locally for the Electron frontend.
# ─────────────────────────────────────────────────────────────────────────────

paths:
  # Relative paths (workspace-relative, portable across machines)
  db_host_windows: "./clark_db"           # Local reference DB (used by build_clark_db.py)
  data_host_windows: "./fastQ_reads"      # Local FASTQ input directory

# Sample basename for inputs: fastQ_reads/{sample}.fastq and results/clark/{sample}.json
sample: "SRR7497167_1"

# ─── CU-CLARK-L Classification Parameters ─────────────────────────────────────
clark:
  threads: 8
  kmer_length: 27   # Default k-mer length for CLARK-L
  sampling_factor: 2  # Sampling factor for CLARK-L (higher = faster, less sensitive)

# ─── Jetson Nano Edge Device (Tailscale SSH) ──────────────────────────────────
# The Jetson Nano runs CU-CLARK-L natively with GPU acceleration.
# The reference database is already stored on the device.
jetson_nano:
  host: "100.71.242.74"                            # Tailscale IP of the Jetson Nano
  user: "pathogen"                                  # SSH username
  remote_db: "/home/pathogen/cuclark_db"             # CLARK reference database on the Nano
  remote_workspace: "/home/pathogen/pathogenius_ws" # Temp workspace for FASTQ & results
  cuclark_dir: "/home/pathogen/cuclark"              # CU-CLARK installation directory
