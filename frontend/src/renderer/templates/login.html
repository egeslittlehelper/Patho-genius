<!-- LOGIN PAGE TEMPLATE -->
<div id="page-login" class="login-view">
    <div class="login-left-panel">
        <div class="brand-container">
            <div class="logo-box">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#008080" stroke-width="2.5">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                </svg>
            </div>
            <h1>Pathogenius</h1>
            <p>Portable, offline metagenomic pathogen detection system for resource-limited settings.</p>
        </div>
    </div>

    <div class="login-right-panel">
        <div class="login-content">
            <div class="login-header">
                <h2>Welcome</h2>
                <p>Sign in to access the system</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username-input">Username</label>
                    <div class="input-wrapper">
                        <svg class="input-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" id="username-input" class="input-field with-icon" placeholder="Enter your username" autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password-input">Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="password-input" class="input-field with-icon-both" placeholder="Enter your password" autocomplete="current-password">
                        <div id="eye-toggle" class="input-icon-right">
                            <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </div>
                    </div>
                </div>

                <div id="login-error" class="login-error hidden"></div>
                <button type="submit" id="login-btn" class="btn-primary-large">Login</button>
                <div class="forgot-password-link">
                    <a href="#" id="forgot-password-btn">Forgot Password?</a>
                </div>
            </form>

            <div class="divider"><span>Emergency Access</span></div>

            <button id="guest-btn" class="btn-guest-large">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M12 8v4"></path><path d="M12 16h.01"></path>
                </svg>
                Guest Mode (Offline Access)
            </button>

            <div class="register-link">
                Don't have an account? <a href="#" id="show-register-btn">Create one</a>
            </div>

            <div class="login-footer">
                <span class="status-dot"></span> System Status: Local/Offline
            </div>
        </div>
    </div>
</div>
